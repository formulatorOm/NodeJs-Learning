<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="udpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="425" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">
    Transport Layer Protocols: TCP vs UDP in Node.js
  </text>
  <text x="425" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Reliable Continuous Stream vs. Low-Latency Discrete Datagrams
  </text>

  <!-- TCP Card -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="360" height="290" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Header banner -->
    <rect width="360" height="50" rx="12" fill="url(#tcpGrad)" />
    <rect y="40" width="360" height="10" fill="#1d4ed8" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      TCP (Transmission Control Protocol)
    </text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">
      Node Module: <tspan fill="#38bdf8">node:net</tspan>
    </text>

    <!-- Points -->
    <circle cx="28" cy="105" r="4" fill="#3b82f6" />
    <text x="42" y="109" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Connection-oriented</b> (3-Way Handshake)</text>

    <circle cx="28" cy="138" r="4" fill="#3b82f6" />
    <text x="42" y="142" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Guaranteed delivery</b> &amp; Order verification</text>

    <circle cx="28" cy="171" r="4" fill="#3b82f6" />
    <text x="42" y="175" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Flow &amp; Congestion Control</b> (Backpressure)</text>

    <circle cx="28" cy="204" r="4" fill="#3b82f6" />
    <text x="42" y="208" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Continuous Byte Stream</b> (No packet boundary)</text>

    <circle cx="28" cy="237" r="4" fill="#3b82f6" />
    <text x="42" y="241" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Higher Overhead</b> (20-60 byte header)</text>

    <!-- Footer pill -->
    <rect x="20" y="255" width="320" height="24" rx="6" fill="#0f172a" />
    <text x="180" y="271" text-anchor="middle" font-family="monospace" font-size="11" fill="#93c5fd">HTTP, HTTPS, SSH, WebSockets, Databases</text>
  </g>

  <!-- UDP Card -->
  <g transform="translate(450, 95)" filter="url(#shadow)">
    <rect width="360" height="290" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Header banner -->
    <rect width="360" height="50" rx="12" fill="url(#udpGrad)" />
    <rect y="40" width="360" height="10" fill="#047857" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      UDP (User Datagram Protocol)
    </text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#34d399">
      Node Module: <tspan fill="#6ee7b7">node:dgram</tspan>
    </text>

    <!-- Points -->
    <circle cx="28" cy="105" r="4" fill="#10b981" />
    <text x="42" y="109" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Connectionless</b> (Fire &amp; Forget datagrams)</text>

    <circle cx="28" cy="138" r="4" fill="#10b981" />
    <text x="42" y="142" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>No retransmission</b>, packets may be lost</text>

    <circle cx="28" cy="171" r="4" fill="#10b981" />
    <text x="42" y="175" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Minimal latency</b>, no handshake or ACK delay</text>

    <circle cx="28" cy="204" r="4" fill="#10b981" />
    <text x="42" y="208" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Discrete Datagrams</b> (Preserves message borders)</text>

    <circle cx="28" cy="237" r="4" fill="#10b981" />
    <text x="42" y="241" font-family="sans-serif" font-size="13" fill="#e2e8f0"><b>Ultra Lightweight</b> (Fixed 8-byte header)</text>

    <!-- Footer pill -->
    <rect x="20" y="255" width="320" height="24" rx="6" fill="#0f172a" />
    <text x="180" y="271" text-anchor="middle" font-family="monospace" font-size="11" fill="#6ee7b7">DNS, VoIP, Live Video Streaming, Multiplayer Games</text>
  </g>
</svg>
