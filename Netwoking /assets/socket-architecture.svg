<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="850" height="400" rx="16" fill="url(#bgGrad3)" />

  <text x="425" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">
    Socket Architecture &amp; The OSI Network Stack
  </text>
  <text x="425" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    A Socket is an Endpoint for Communication: IP Address (Host) + Port (Process)
  </text>

  <!-- Left: OSI Model Layers -->
  <g transform="translate(40, 95)">
    <rect width="320" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">
      OSI Model vs Node.js Core
    </text>

    <!-- Layer 7 -->
    <rect x="20" y="45" width="280" height="36" rx="6" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" />
    <text x="35" y="68" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe">Application (L7):</text>
    <text x="145" y="68" font-family="monospace" font-size="11" fill="#e0e7ff">node:http, https, dns</text>

    <!-- Layer 4 -->
    <rect x="20" y="90" width="280" height="48" rx="6" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <text x="35" y="112" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Transport (L4) ★:</text>
    <text x="35" y="128" font-family="monospace" font-size="11" fill="#bae6fd">TCP (node:net) | UDP (node:dgram)</text>

    <!-- Layer 3 -->
    <rect x="20" y="147" width="280" height="36" rx="6" fill="#64748b" fill-opacity="0.15" stroke="#64748b" />
    <text x="35" y="170" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Network (L3):</text>
    <text x="135" y="170" font-family="monospace" font-size="11" fill="#cbd5e1">IP (IPv4 / IPv6 Routing)</text>

    <!-- Layer 2 & 1 -->
    <rect x="20" y="192" width="280" height="36" rx="6" fill="#475569" fill-opacity="0.15" stroke="#475569" />
    <text x="35" y="215" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">Data Link &amp; Physical:</text>
    <text x="175" y="215" font-family="monospace" font-size="11" fill="#94a3b8">Ethernet, Wi-Fi, MAC</text>

    <text x="160" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8">
      ★ Sockets bridge userland JS to kernel L4 sockets
    </text>
  </g>

  <!-- Right: Node.js Socket Architecture -->
  <g transform="translate(400, 95)">
    <rect width="410" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="205" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">
      Node.js libuv Non-Blocking Event Loop
    </text>

    <!-- JS Userland -->
    <rect x="25" y="50" width="360" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" />
    <text x="205" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#bfdbfe">
      JavaScript: socket.on('data') / socket.write()
    </text>

    <!-- arrow -->
    <line x1="205" y1="90" x2="205" y2="115" stroke="#60a5fa" stroke-width="2" />

    <!-- Node C++ Bindings & libuv -->
    <rect x="25" y="115" width="360" height="50" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" />
    <text x="205" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c4b5fd">
      Node.js C++ Layer &amp; libuv
    </text>
    <text x="205" y="153" text-anchor="middle" font-family="monospace" font-size="11" fill="#ddd6fe">
      Epoll (Linux) / Kqueue (macOS) / IOCP (Windows)
    </text>

    <!-- arrow -->
    <line x1="205" y1="165" x2="205" y2="190" stroke="#a78bfa" stroke-width="2" />

    <!-- OS Kernel -->
    <rect x="25" y="190" width="360" height="60" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
    <text x="205" y="213" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">
      Operating System Kernel (Socket Descriptors)
    </text>
    <text x="205" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#a7f3d0">
      Kernel Send/Receive Buffers ⇄ Network Card (NIC)
    </text>
  </g>
</svg>
