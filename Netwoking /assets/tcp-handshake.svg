<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399" />
    </marker>
    <marker id="arrowRightRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f87171" />
    </marker>
    <marker id="arrowLeftRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fb923c" />
    </marker>
  </defs>

  <rect width="850" height="480" rx="16" fill="url(#bgGrad2)" />

  <!-- Title -->
  <text x="425" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">
    TCP Connection Lifecycle: 3-Way Handshake &amp; Teardown
  </text>
  <text x="425" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Underlying kernel sequence managed automatically by <tspan font-family="monospace" fill="#38bdf8">net.createServer()</tspan> and <tspan font-family="monospace" fill="#38bdf8">net.createConnection()</tspan>
  </text>

  <!-- Client Column Header -->
  <rect x="140" y="90" width="160" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="220" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">
    Client (net.Socket)
  </text>

  <!-- Server Column Header -->
  <rect x="550" y="90" width="160" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <text x="630" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">
    Server (net.Server)
  </text>

  <!-- Lifeline Client -->
  <line x1="220" y1="130" x2="220" y2="440" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Lifeline Server -->
  <line x1="630" y1="130" x2="630" y2="440" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Section: Handshake -->
  <rect x="60" y="145" width="730" height="135" rx="8" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.2" />
  <text x="75" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">PHASE 1: 3-WAY HANDSHAKE (ESTABLISH CONNECTION)</text>

  <!-- Step 1: SYN -->
  <line x1="220" y1="185" x2="620" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="420" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc">1. SYN (Synchronize Sequence Number)</text>

  <!-- Step 2: SYN-ACK -->
  <line x1="630" y1="215" x2="230" y2="235" stroke="#34d399" stroke-width="2" marker-end="url(#arrowLeft)" />
  <text x="420" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">2. SYN-ACK (Acknowledge + Syn)</text>

  <!-- Step 3: ACK -->
  <line x1="220" y1="250" x2="620" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="420" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc">3. ACK (Connection Established → 'connect' / 'connection')</text>

  <!-- Section: Data Transfer -->
  <rect x="60" y="290" width="730" height="50" rx="8" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.2" />
  <line x1="220" y1="315" x2="620" y2="315" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="420" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c4b5fd">
    FULL-DUPLEX DATA STREAM: socket.write() ⇄ socket.on('data')
  </text>

  <!-- Section: Teardown -->
  <rect x="60" y="350" width="730" height="85" rx="8" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.2" />
  <text x="75" y="370" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f87171">PHASE 2: 4-WAY HANDSHAKE (GRACEFUL CLOSE: socket.end())</text>

  <!-- Step 1: FIN -->
  <line x1="220" y1="390" x2="620" y2="395" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRightRed)" />
  <text x="420" y="388" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fca5a5">1. FIN (socket.end()) → 2. ACK (Half-Close)</text>

  <!-- Step 2: Server FIN -->
  <line x1="630" y1="415" x2="230" y2="420" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowLeftRed)" />
  <text x="420" y="413" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fdba74">3. FIN (Server closes) → 4. ACK ('close' event fired)</text>
</svg>
